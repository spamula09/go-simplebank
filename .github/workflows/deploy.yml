# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Deploy to Production

on:
  push:
    branches: [ "master" ]

jobs:

  deploy :
    name: Build image 
    runs-on: ubuntu-latest   

    permissions:
      id-token: write   # Required for OIDC
      contents: read
    
    steps:
      
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
         version: 'v1.31.0' # default is latest stable
        id: install

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::320527135875:role/my-github-role
          aws-region: us-east-2
      
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Load secrets and save to app.env 
        run: aws secretsmanager get-secret-value --secret-id simplebank_secrets  --query SecretString --output text |jq -r 'to_entries|map("\(.key)=\(.value)")|.[]' >app.env
      - name: Build and push Docker image
        env:
          ECR_REGISTRY:  320527135875.dkr.ecr.us-east-2.amazonaws.com
          ECR_REPOSITORY: go/simplebank
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest  .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY
      
      - name: Update eks kubeconfig
        run : aws eks update-kubeconfig --name simplebank --region us-east-2

      - name: Deploy image to Amazon EKS
        run: |
          
          kubectl apply -f eks/aws-auth.yaml
          kubectl apply -f eks/deployment.yaml
          kubectl apply -f eks/service.yaml