services:
  postgres:
    image: postgres:18-alpine
    environment: 
     - POSTGRES_USER=root
     - POSTGRES_PASSWORD=secret
     - POSTGRES_DB=simplebank
    ports:
     - "5432:5432"
  
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
     - "8080:8080"
    environment:
     - DB_SOURCE="postgresql://root:secret@postgres:5432/simplebank?sslmode=disable"
